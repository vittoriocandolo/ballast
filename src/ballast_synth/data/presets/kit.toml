schema = 3
seed = 1

[body]
tune_hz   = 55.0
level_db  = 0.0
h2        = 0.0             # second harmonic, 0 … 0.5
bright_hz = 0.0             # harmonics fade above; 0 = sine
phase_deg = 0.0
phase_ref = "onset"         # "onset" | "tail"
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0,  ratio = 1.12 },
  { ms = 40.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.5,   gain = 1.0 },
  { ms = 40.0,  gain = 0.6 },
  { ms = 140.0, gain = 0.2 },
  { ms = 240.0, gain = 0.04 },
  { ms = 300.0, gain = 0.0 },
]
modes = [                   # ratio to the body, dB re its sine, ms to fall 60 dB
  { ratio = 1.594, db = -5.0,  decay_ms = 140.0 },
  { ratio = 2.136, db = -9.0,  decay_ms = 90.0 },
  { ratio = 2.296, db = -12.0, decay_ms = 80.0 },
  { ratio = 2.653, db = -14.0, decay_ms = 60.0 },
  { ratio = 7.3,   db = -16.0, decay_ms = 35.0 },
]

[attack]
level_db      = -14.0
tone_hz       = 2200.0
noise_mix     = 1.0         # 0 = tone … 1 = noise
noise_band_hz = [900.0, 6000.0]
pitch = [                   # ratio to tone_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.0 },
]
amp = [
  { ms = 0.0, gain = 0.0 },
  { ms = 0.1, gain = 1.0 },
  { ms = 1.0, gain = 0.3 },
  { ms = 4.0, gain = 0.0 },
]

[drive]
db        = 3.0             # small-signal gain; 0 = bypass
asymmetry = 0.0             # even harmonics, 0 … 1
mix       = 1.0             # 0 = dry … 1 = driven

[room]
level_db    = -10.0         # re the kick's energy
decay_ms    = 700.0         # to fall 60 dB, at low frequencies
damping_hz  = 3500.0        # fades twice as fast here
predelay_ms = 6.0

[eq]
low_hz    = 80.0            # low shelf
low_db    = 0.0             # 0 = off
bell_hz   = 180.0           # bell
bell_db   = 0.0             # 0 = off
bell_q    = 1.0             # 0.3 = wide … 10 = narrow
high_hz   = 8000.0          # high shelf
high_db   = 0.0             # 0 = off
cutoff_hz = 0.0             # low-pass, 12 dB/oct; 0 = off
resonance = 0.707           # Q: 0.707 = flat … 10

[clip]
db      = 0.0               # off the peaks; 0 = off
knee_db = 4.0               # 0 = hard … 6 = soft

[output]
sample_rate = 48000
low_cut_hz  = 0.0           # high-pass, 12 dB/oct; 0 = off
mode        = "true-peak"   # "gain" | "peak" | "true-peak"
db          = -1.0          # gain in dB, or peak target
polarity    = 1

[play]
soft_db       = -24.0       # the softest hit's level
soft_click_db = -8.0        # and its click's, further
soft_punch    = 0.5         # of the pitch drop it keeps
spread        = 0.6         # how much each repeat differs
