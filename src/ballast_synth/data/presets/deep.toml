schema = 3
seed = 1

[body]
tune_hz   = 48.999
level_db  = 0.0
h2        = 0.0             # second harmonic, 0 … 0.5
bright_hz = 0.0             # harmonics fade above; 0 = sine
phase_deg = 0.0
phase_ref = "onset"         # "onset" | "tail"
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0,  ratio = 2.5 },
  { ms = 20.0, ratio = 1.3 },
  { ms = 60.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 2.0,   gain = 1.0 },
  { ms = 80.0,  gain = 0.7 },
  { ms = 250.0, gain = 0.35 },
  { ms = 480.0, gain = 0.08 },
  { ms = 600.0, gain = 0.0 },
]
modes = []                  # ratio to the body, dB re its sine, ms to fall 60 dB

[attack]
level_db      = -26.0
tone_hz       = 800.0
noise_mix     = 0.3         # 0 = tone … 1 = noise
noise_band_hz = [400.0, 3000.0]
pitch = [                   # ratio to tone_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.0 },
]
amp = [
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.5,  gain = 1.0 },
  { ms = 3.0,  gain = 0.3 },
  { ms = 10.0, gain = 0.0 },
]

[drive]
db        = 8.0             # small-signal gain; 0 = bypass
asymmetry = 0.2             # even harmonics, 0 … 1
mix       = 1.0             # 0 = dry … 1 = driven

[sub]
level_db = -6.0
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 40.0,  gain = 1.0 },
  { ms = 400.0, gain = 0.6 },
  { ms = 700.0, gain = 0.0 },
]

[room]
level_db    = -14.0         # re the kick's energy
decay_ms    = 800.0         # to fall 60 dB, at low frequencies
damping_hz  = 2500.0        # fades twice as fast here
predelay_ms = 20.0

[eq]
low_hz    = 80.0            # low shelf
low_db    = 0.0             # 0 = off
bell_hz   = 180.0           # bell
bell_db   = 0.0             # 0 = off
bell_q    = 1.0             # 0.3 = wide … 10 = narrow
high_hz   = 8000.0          # high shelf
high_db   = 0.0             # 0 = off
cutoff_hz = 900.0           # low-pass, 12 dB/oct; 0 = off
resonance = 0.707           # Q: 0.707 = flat … 10

[clip]
db      = 3.0               # off the peaks; 0 = off
knee_db = 6.0               # 0 = hard … 6 = soft

[output]
sample_rate = 48000
low_cut_hz  = 0.0           # high-pass, 12 dB/oct; 0 = off
mode        = "true-peak"   # "gain" | "peak" | "true-peak"
db          = -1.0          # gain in dB, or peak target
polarity    = 1
