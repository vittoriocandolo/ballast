[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ballast-synth"  # "ballast" is taken on PyPI; the package and the command are still ballast
version = "0.1.0"
description = "A kick drum synthesizer that renders a text patch to an alias-free, sampler-ready WAV"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vittorio Candolo" }]
keywords = ["audio", "synthesizer", "kick drum", "drum synthesis", "dsp", "wav", "sampler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = ["numpy>=1.24", "scipy>=1.14"]

[project.optional-dependencies]
audition = ["sounddevice>=0.4"]

[project.scripts]
ballast = "ballast.cli:main"

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ballast"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true  # SciPy and sounddevice ship no type information

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
