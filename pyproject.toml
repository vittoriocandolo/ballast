[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "ballast-synth"  # the command is still ballast
version = "0.1.0"
description = "A one-voice kick drum synthesizer that renders a text patch to a tuned, sampler-ready WAV"
dynamic = ["readme"]  # README.md, its links made absolute for PyPI by hatch_build.py
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Vittorio Candolo" }]
keywords = ["audio", "synthesizer", "drum", "kick", "sfz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = ["numpy>=2.4", "scipy>=1.17"]

[project.urls]
Repository = "https://github.com/vittoriocandolo/ballast"
Documentation = "https://github.com/vittoriocandolo/ballast/tree/main/docs"
Changelog = "https://github.com/vittoriocandolo/ballast/blob/main/CHANGELOG.md"
Issues = "https://github.com/vittoriocandolo/ballast/issues"

[project.optional-dependencies]
audition = ["sounddevice>=0.5"]

[project.scripts]
ballast = "ballast_synth.cli:main"

[dependency-groups]
dev = ["coverage>=7.17", "hatchling>=1.32", "hypothesis>=6.170", "mdformat>=0.7.22", "mdformat-dollarmath>=0.0.5", "mdformat-frontmatter>=2.1", "mdformat-gfm>=1.0", "mypy>=2.4", "pytest>=9.1", "ruff>=0.17", "typos>=1.51", "zizmor>=1.31"]
fuzz = ["atheris>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64'"]  # wheels only there

[tool.hatch.metadata.hooks.custom]  # hatch_build.py

[tool.uv]
required-version = ">=0.13"

[tool.mypy]
files = ["src", "tests", "tools", "docs", "fuzz", "hatch_build.py"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = ["atheris", "scipy.*", "sounddevice"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["ballast_synth"]
branch = true

[tool.coverage.report]
fail_under = 100  # every line and every branch: each behavior has a test
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # contradicts D211: no blank line before a class docstring
    "D213",  # contradicts D212: a multi-line docstring's summary starts on its first line
]
allowed-confusables = ["×", "−", "–", "α", "γ", "ρ"]  # math notation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest checks with assert, and rewrites it so that it also runs under python -O
"fuzz/**" = ["S101"]  # a broken assertion is a finding, which Atheris reports with its input

[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?m)^# Copyright \(C\) \d{4}(-\d{4})? .+\n# SPDX-License-Identifier: GPL-3\.0-or-later$'  # the copyright line, then the SPDX licence identifier

[tool.typos.default]
locale = "en-gb"  # British spelling, with -ize (Oxford): the -ize forms in use are listed below
extend-ignore-re = [
  "prefers-color-scheme",  # CSS, in the figures' style
]

[tool.typos.default.extend-words]
writeable = "writeable"  # NumPy's spelling, in ndarray.flags
normalize = "normalize"
normalized = "normalized"
optimize = "optimize"
quantization = "quantization"
quantize = "quantize"
quantized = "quantized"
recognizable = "recognizable"
synthesize = "synthesize"
synthesized = "synthesized"
synthesizes = "synthesizes"
visualization = "visualization"

# the -ise spellings of the same words, corrected to -ize
normalise = "normalize"
normalised = "normalized"
optimise = "optimize"
quantisation = "quantization"
quantise = "quantize"
quantised = "quantized"
recognisable = "recognizable"
synthesise = "synthesize"
synthesised = "synthesized"
synthesises = "synthesizes"
visualisation = "visualization"

[tool.typos.files]
extend-exclude = [
  "LICENSE",  # the licence's own text, as its authors wrote it
]
