[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ballast"
version = "0.1.0"
description = "A one-voice kick drum synthesizer, rendered offline to WAV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.14"]

[project.optional-dependencies]
audition = ["sounddevice>=0.4"]

[project.scripts]
ballast = "ballast.cli:main"

[tool.setuptools.package-data]
ballast = ["data/*.json", "data/*.f64", "data/presets/*.toml"]

[tool.ruff]
line-length = 120
