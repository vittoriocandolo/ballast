<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 960 296" width="960" height="296" role="img"><title>Signal flow from patch to WAV</title><style>
.fig{--paper:#fbfcfd;--panel:#f1f4f7;--ink:#0e1116;--ink-2:#4a5361;--muted:#626c7a;--rule:#dde3ea;--grid:#e9edf2;--accent:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--step-1:#86b6ef;--step-2:#3987e5;--step-3:#1c5cab;--step-4:#0d366b;--show-light:inline;--show-dark:none;}
@media (prefers-color-scheme: dark){.fig{--paper:#0f1216;--panel:#171c22;--ink:#e7ecf1;--ink-2:#aab4c0;--muted:#8b96a4;--rule:#29313b;--grid:#1c2229;--accent:#3987e5;--series-2:#d95926;--series-3:#199e70;--step-1:#184f95;--step-2:#2a78d6;--step-3:#6da7ec;--step-4:#b7d3f6;--show-light:none;--show-dark:inline;}}
.fig .bg{fill:var(--paper)}
.fig .grid{fill:none;stroke:var(--grid);stroke-width:1}
.fig .axis{fill:none;stroke:var(--rule);stroke-width:1}
.fig .zero{fill:none;stroke:var(--muted);stroke-width:1;stroke-opacity:.45}
.fig text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.fig .label{fill:var(--ink-2)}
.fig .title{fill:var(--ink);font-size:15px;font-weight:600}
.fig .name{fill:var(--ink);font-family:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;font-size:15px;font-weight:700}
.fig .math{fill:var(--ink-2);font-family:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;font-size:12px}
.fig .boxtitle{fill:var(--ink);font-size:13px;font-weight:600}
.fig .peak{fill:var(--accent);fill-opacity:.3}
.fig .rms{fill:var(--accent)}
.fig .trace{fill:none;stroke:var(--accent);stroke-width:1.25;stroke-linejoin:round}
.fig .s1{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--accent)}
.fig .s2{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--series-2)}
.fig .s3{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--series-3)}
.fig .o1{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--step-1)}
.fig .o2{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--step-2)}
.fig .o3{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--step-3)}
.fig .o4{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--step-4)}
.fig .ref{fill:none;stroke:var(--muted);stroke-width:1.25}
.fig .halo{fill:none;stroke:var(--muted);stroke-opacity:.35;stroke-width:7}
.fig .key1,.fig .bar{fill:var(--accent)}
.fig .key2{fill:var(--series-2)}
.fig .key3{fill:var(--series-3)}
.fig .ko1{fill:var(--step-1)}
.fig .ko2{fill:var(--step-2)}
.fig .ko3{fill:var(--step-3)}
.fig .ko4{fill:var(--step-4)}
.fig .kref{fill:var(--muted)}
.fig .khalo{fill:var(--muted);fill-opacity:.35}
.fig .knot,.fig .dot1{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.fig .dot2{fill:var(--series-2);stroke:var(--paper);stroke-width:2}
.fig .dot3{fill:var(--series-3);stroke:var(--paper);stroke-width:2}
.fig .band{fill:var(--accent);fill-opacity:.08}
.fig .limit{fill:none;stroke:var(--ink-2);stroke-width:1}
.fig .box{fill:var(--paper);stroke:var(--rule);stroke-width:1}
.fig .zone{fill:var(--panel);stroke:var(--rule);stroke-width:1}
.fig .flow{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.fig .head{fill:var(--ink-2)}
.fig .light{display:var(--show-light)}
.fig .dark{display:var(--show-dark)}
</style><rect class="bg" width="960" height="296" rx="10"/><text class="title" x="28" y="36">Signal flow</text><text class="label" x="28" y="57">From the patch's curves to a WAV file</text><defs><marker id="pipeline-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,1L10,5L0,9Z"/></marker></defs><rect class="zone" x="16" y="76" width="520" height="196" rx="8"/><text class="label" x="32" y="98">16 × the base rate: 705.6 or 768 kHz</text><text class="label" x="834" y="98" text-anchor="middle">at the file's sample rate</text><rect class="box" x="32" y="112" width="150" height="64" rx="6"/><text class="boxtitle" x="44" y="133">Body</text><text class="math" x="44" y="152">sin φ + h₂ sin 2φ</text><text class="label" x="44" y="168">pitch curve to phase</text><rect class="box" x="32" y="192" width="150" height="64" rx="6"/><text class="boxtitle" x="44" y="213">Attack</text><text class="math" x="44" y="232">tone + noise</text><text class="label" x="44" y="248">seeded, band-limited</text><circle class="box" cx="214" cy="174" r="14"/><text class="boxtitle" x="214" y="179" text-anchor="middle">+</text><path class="flow" d="M182,144C192,144 204,144 208,159" marker-end="url(#pipeline-head)"/><path class="flow" d="M182,224C192,224 204,204 208,189" marker-end="url(#pipeline-head)"/><rect class="box" x="246" y="142" width="136" height="64" rx="6"/><text class="boxtitle" x="258" y="163">Drive</text><text class="math" x="258" y="182">tanh(αx)/tanh α</text><text class="label" x="258" y="198">0 dB: bypass</text><path class="flow" d="M228,174H244" marker-end="url(#pipeline-head)"/><rect class="box" x="402" y="142" width="118" height="64" rx="6"/><text class="boxtitle" x="414" y="163">Low cut</text><text class="label" x="414" y="182">12 dB/octave</text><text class="label" x="414" y="198">0 Hz: off</text><path class="flow" d="M382,174H400" marker-end="url(#pipeline-head)"/><rect class="box" x="566" y="142" width="128" height="64" rx="6"/><text class="boxtitle" x="578" y="163">Decimator</text><text class="math" x="578" y="182">↓16, ↓8 or ↓4</text><text class="label" x="578" y="198">minimum phase</text><path class="flow" d="M520,174H564" marker-end="url(#pipeline-head)"/><rect class="box" x="720" y="142" width="110" height="64" rx="6"/><text class="boxtitle" x="732" y="163">Output</text><text class="label" x="732" y="182">gain or peak</text><text class="label" x="732" y="198">polarity</text><path class="flow" d="M694,174H718" marker-end="url(#pipeline-head)"/><rect class="box" x="850" y="142" width="98" height="64" rx="6"/><text class="boxtitle" x="862" y="163">WAV</text><text class="label" x="862" y="182">float or PCM</text><text class="label" x="862" y="198">patch inside</text><path class="flow" d="M830,174H848" marker-end="url(#pipeline-head)"/></svg>
